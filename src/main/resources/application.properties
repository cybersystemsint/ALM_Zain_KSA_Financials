# ─── Database ────────────────────────────────────────────────────────────────
# spring.datasource.url=jdbc:mysql://10.123.105.59:3306/ALM_ZAIN_KSA\
spring.datasource.url=jdbc:mysql://10.123.105.59:3306/ALM_ZAIN_KSA\
  ?rewriteBatchedStatements=true\
  &useSSL=false\
  &allowPublicKeyRetrieval=true\
  &serverTimezone=UTC\
  &useCursorFetch=false\
  &defaultFetchSize=0\
  &useServerPrepStmts=true

spring.datasource.username=root
spring.datasource.password=ALM-KSA_db20@5
# spring.datasource.password=ALMDev@2024!
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
hibernate.show_sql=true

# ─── HikariCP ────────────────────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=8
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=570000
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.connection-test-query=SELECT 1

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.properties.hibernate.jdbc.fetch_size=1000
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# ─── Async / MVC ─────────────────────────────────────────────────────────────
# FIX 1: was missing — Spring default is 10s which kills any export > 10 seconds
spring.mvc.async.request-timeout=3600000

# FIX 2: Tomcat socket-level connection timeout (default is 60s).
# Must match async timeout — if the DB query takes >60s before first bytes are
# written, Tomcat closes the socket regardless of spring.mvc.async.request-timeout.
server.tomcat.connection-timeout=3600000

# ─── Server ──────────────────────────────────────────────────────────────────
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/xml,text/plain,application/json,application/javascript,text/css

server.tomcat.max-http-form-content-size=100MB
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.file.name=/data/app/logs/ALM/Assets/AssetManagement.log
logging.config=classpath:logback-spring.xml

# ─── Export ──────────────────────────────────────────────────────────────────
app.export.dir=/data/app
app.export.queue-size=20
app.export.retention-hours=5
app.export.max-threads=3

# ─── Schedulers ──────────────────────────────────────────────────────────────
app.export.prewarm-cron=0 0 2 * * *
app.scheduler.unmapped-check-cron=0 0 20 * * *
app.scheduler.monthly-job-cron=0 0 0 L * ?
spring.task.scheduling.pool.size=4

