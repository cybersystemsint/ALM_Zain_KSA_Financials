# ─── Database ────────────────────────────────────────────────────────────────
#IONOS V1

#spring.datasource.url=jdbc:mysql://127.0.0.1:3306/ALM_ZAIN_KSA
spring.datasource.url=jdbc:mysql://194.164.17.17:3306/ALM_ZAIN_KSA\
  ?rewriteBatchedStatements=true\
  &useSSL=false\
  &allowPublicKeyRetrieval=true\
  &serverTimezone=UTC\
  &useCursorFetch=false\
  &defaultFetchSize=0\
  &useServerPrepStmts=false

# ──────────────────────────────────────────────────────────────────────────────
# NEW JDBC URL PARAMETERS — WHY EACH ONE MATTERS:
#
# useCursorFetch=false
#   When our ExportExecutor calls ps.setFetchSize(5000), MySQL Connector/J
#   uses a streaming ResultSet that reads rows from the network socket in
#   chunks. Without this flag, the driver may try to buffer the entire 3M
#   result set in client memory → OOM.
#
# defaultFetchSize=0
#   Pairs with useCursorFetch=false. Ensures the default behavior is
#   non-buffering, and our explicit setFetchSize(5000) in ExportExecutor
#   controls the streaming chunk size.
#
# useServerPrepStmts=false
#   Client-side prepared statements. The streaming export runs a single
#   SELECT for 5-10 minutes — server-side cursors add overhead without
#   benefit for this use case.
# ──────────────────────────────────────────────────────────────────────────────

spring.datasource.username=root
spring.datasource.password=ALMDev@2024!
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
hibernate.show_sql=true

# ─── HikariCP ────────────────────────────────────────────────────────────────
# FIX 1: max-lifetime MUST be less than MySQL's wait_timeout (default 8 hours)
#         but your connections were dying after ~28 min → MySQL wait_timeout is
#         likely set to ~30 min on this server. Set max-lifetime to 25 min (1500s)
#         so Hikari recycles connections before MySQL kills them.

# CHANGED: 10 → 15. Each streaming export holds 1 connection for the entire
# duration (5-10 min for 3M rows). With max-threads=3, that's 3 connections
# permanently occupied during exports. Remaining 12 serve list/upload/status.
# Formula: pool >= max-export-threads(3) + normal-app-connections(10) + buffer(2)
spring.datasource.hikari.maximum-pool-size=15

spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000

# KEY FIX: was 1800000 (30 min) — MySQL killed it at ~28 min
# Set to 25 min (1500000 ms) so Hikari recycles before MySQL times out
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.initialization-fail-timeout=0
# FIX 2: keepalive ping every 2 min — prevents MySQL from treating
#         the connection as idle and closing it mid-long-query
spring.datasource.hikari.keepalive-time=120000

# FIX 3: validation query so Hikari detects dead connections immediately
spring.datasource.hikari.connection-test-query=SELECT 1

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.properties.hibernate.jdbc.fetch_size=1000
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Without this, Hibernate sends N individual statements even if you call saveAll()

# Recommended: see batch statements in SQL logs during testing
# spring.jpa.properties.hibernate.generate_statistics=true
# logging.level.org.hibernate.stat=DEBUG

# FIX 4: disable open-session-in-view — stops Hibernate holding DB connections
#         for the full duration of the HTTP request lifecycle
spring.jpa.open-in-view=false

# ─── Async / MVC ─────────────────────────────────────────────────────────────
# FIX 5: was 3600000 (1 hour) — but this only applies to Spring MVC async,
#         NOT to synchronous request handling. The reconciliation runs
#         synchronously on the HTTP thread. See AsyncConfig.java fix instead.
spring.mvc.async.request-timeout=3600000

# ─── Server ───────────────────────────────────────────────────────────────────
server.compression.enabled=true
server.compression.min-response-size=1024

# NEW: Increase max request size for large upload payloads (bulk upload endpoint)
server.tomcat.max-http-form-content-size=100MB
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.file.name=/home/app/logs/ALM/Assets/AssetManagement.log
logging.config=classpath:logback-spring.xml

# ── Export config ──────────────────────────────────────────────────────────────
# Where async export files are saved temporarily before download.
# Make sure this directory is writable by the app user.
# Default falls back to system temp dir if not set.
app.export.dir=/data/app/financials-exports
app.export.retention-hours=5

# NEW: Max concurrent export threads. Each uses ~15 MB heap + 1 DB connection.
# Keep this <= (hikari.maximum-pool-size - 10) to leave room for normal traffic.
app.export.max-threads=3

# NEW: Pre-warm cron schedule (daily at 2 AM server time).
# Generates unfiltered export files in background so full-dataset downloads are instant.
app.export.prewarm-cron=0 0 2 * * *
app.scheduler.unmapped-check-cron=0 0 20 * * *
app.scheduler.monthly-job-cron=0 0 0 L * ?
# ─── Scheduling ───────────────────────────────────────────────────────────────
# NEW: Enable Spring scheduling (required for export cleanup + pre-warm cron)
spring.task.scheduling.pool.size=2