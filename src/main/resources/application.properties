spring.datasource.initialize=false

# ============================================================================
# SERVER COMPRESSION
# ============================================================================
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet

# ============================================================================
# HIKARICP CONNECTION POOL - OPTIMIZED FOR STREAMING
# ============================================================================
# Pool size: Reduced for long-running queries
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# Timeouts: Extended for long-running export queries
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# CRITICAL: Leak detection for long-running queries (5 minutes)
spring.datasource.hikari.leak-detection-threshold=300000

# Health check
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=3000

# ============================================================================
# HIKARICP DATA SOURCE PROPERTIES - PERFORMANCE TUNING
# ============================================================================
# Statement caching
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true

# Batch processing
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true

# Network timeouts for remote DB (5 minutes for streaming)
spring.datasource.hikari.data-source-properties.socketTimeout=300000
spring.datasource.hikari.data-source-properties.netTimeoutForStreamingResults=300000

# ============================================================================
# JPA/HIBERNATE PROPERTIES
# ============================================================================
# ?? IMPORTANT: Don't set fetch_size here - we set it dynamically in code
# spring.jpa.properties.hibernate.jdbc.fetch_size=5000
spring.jpa.properties.hibernate.jdbc.batch_size=5000
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# ============================================================================
# SPRING MVC ASYNC - EXTENDED TIMEOUT FOR STREAMING
# ============================================================================
# 1 hour timeout for large exports
spring.mvc.async.request-timeout=3600000

# ============================================================================
# LOGGING
# ============================================================================
logging.file.name=/data/app/logs/ALM/Assets/AssetManagement.log
logging.config=classpath:logback-spring.xml

# Log levels
logging.level.com.telkom.co.ke.almoptics=INFO
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.com.zaxxer.hikari=INFO

